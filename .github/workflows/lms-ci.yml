name: Shaivika LMS SaaS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Java 21 LTS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permissions to Maven Wrapper
        working-directory: backend-java
        run: chmod +x mvnw

      - name: Run Backend Integration & Unit Tests
        working-directory: backend-java
        run: ./mvnw clean test -B

  frontend-build:
    name: Frontend Build & Typecheck (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

