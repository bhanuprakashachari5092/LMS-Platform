# KaizenQ Production Nginx Configuration
# EC2 Ubuntu — /etc/nginx/sites-available/kaizenq
#
# APPLY ON SERVER:
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# VERIFY SOCKET:
#   curl -s "https://kaizenq.in/socket.io/?EIO=4&transport=polling" | head -c 100
#   Should return: 0{"sid":"...","upgrades":["websocket"],...}
#   NOT: <!DOCTYPE html> (which means Nginx is incorrectly serving the frontend)

# Map for clean WebSocket upgrade / HTTP polling dual support
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name kaizenq.in www.kaizenq.in;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kaizenq.in www.kaizenq.in;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate     /etc/letsencrypt/live/kaizenq.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaizenq.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── CRITICAL: Socket.IO WebSocket Proxy ───────────────────────────────────
    # Must come BEFORE the general /api/ and / blocks.
    # This routes the /socket.io/ handshake + WebSocket upgrade to the Node.js server.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;

        # WebSocket upgrade headers — REQUIRED for socket.io transports
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward real client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — keep WebSocket connections alive for long class sessions
        proxy_read_timeout    86400s;  # 24 hours
        proxy_send_timeout    86400s;
        proxy_connect_timeout 60s;

        # Disable buffering for real-time events
        proxy_buffering    off;
        proxy_cache        off;
    }
    # ─────────────────────────────────────────────────────────────────────────────

    # ─── REST API Proxy ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increased body size for file upload endpoints
        client_max_body_size 50M;
        proxy_read_timeout 60s;
    }
    # ─────────────────────────────────────────────────────────────────────────────

    # ─── Frontend SPA (React / Vite build) ───────────────────────────────────
    # Adjust root path to wherever your built frontend is deployed
    root /var/www/kaizenq/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
    # ─────────────────────────────────────────────────────────────────────────────

    # ─── Health endpoint ──────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
    # ─────────────────────────────────────────────────────────────────────────────

    # Logging
    access_log  /var/log/nginx/kaizenq_access.log;
    error_log   /var/log/nginx/kaizenq_error.log warn;
}
